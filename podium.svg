<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d1fae5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>

    <clipPath id="aboveGround">
      <rect x="0" y="-50" width="500" height="300" />
    </clipPath>
  </defs>

  <g clip-path="url(#aboveGround)">
    
    <g transform="translate(340, 250)">
      <animateTransform attributeName="transform" type="translate"
        values="340,250; 340,160; 340,170" keyTimes="0; 0.7; 1"
        calcMode="spline" keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1"
        dur="0.6s" begin="0.5s" fill="freeze" />
      <rect x="-40" y="0" width="80" height="100" fill="url(#grad3)" rx="6" ry="6" />
      <text x="0" y="35" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="32" font-family="sans-serif" font-weight="bold">3</text>
    </g>

    <g transform="translate(160, 250)">
      <animateTransform attributeName="transform" type="translate"
        values="160,250; 160,130; 160,140" keyTimes="0; 0.7; 1"
        calcMode="spline" keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1"
        dur="0.6s" begin="1.3s" fill="freeze" />
      <rect x="-40" y="0" width="80" height="130" fill="url(#grad2)" rx="6" ry="6" />
      <text x="0" y="35" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="32" font-family="sans-serif" font-weight="bold">2</text>
    </g>

    <g transform="translate(250, 250)">
        <animateTransform id="p1Rise" attributeName="transform" type="translate"
        values="250,250; 250,235; 250,235; 250,90; 250,110"
        keyTimes="0; 0.2; 0.75; 0.9; 1"
        calcMode="spline" 
        keySplines="0.5 0 1 1; 0 0 1 1; 0.25 0.1 0.25 1; 0.25 0.1 0.25 1"
        dur="2.0s" begin="2.2s" fill="freeze" />
        
      <g>
        <animateTransform attributeName="transform" type="translate"
            values="0,0; 3,0; -3,0; 1,2; -2,-1; 0,0"
            dur="0.1s" repeatCount="11" begin="2.6s" fill="freeze"/>
        <animateTransform attributeName="transform" type="rotate"
            values="0; 1; -1; 0.5; -0.5; 0"
            dur="0.1s" repeatCount="11" begin="2.6s" additive="sum" fill="freeze"/>
            
        <rect x="-40" y="0" width="80" height="160" fill="url(#grad1)" rx="6" ry="6" />
        <text x="0" y="40" text-anchor="middle" dominant-baseline="middle" fill="#047857" font-size="36" font-family="sans-serif" font-weight="bold">1</text>
      </g>
    </g>

  </g>

  <g transform="translate(0, 250)">
    <rect x="0" y="0" width="500" height="50" fill="#57534e" />
    <path d="M0,0 Q25,-4 50,0 T100,0 T150,-3 T200,0 T250,-5 T300,0 T350,-2 T400,0 T450,-4 T500,0 L500,6 L0,6 Z" fill="#44403c" />
  </g>

  <g transform="translate(340, 250)">
    <circle cx="0" cy="0" r="5" fill="#78350f" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="0.8s" begin="0.5s" fill="freeze"/><animate attributeName="cx" values="0; -40" dur="0.8s" begin="0.5s" fill="freeze"/><animate attributeName="cy" values="0; -40; 20" keyTimes="0; 0.4; 1" calcMode="spline" keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1" dur="0.8s" begin="0.5s" fill="freeze"/></circle>
    <rect x="-3" y="-3" width="6" height="6" fill="#57534e" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="0.8s" begin="0.55s" fill="freeze"/><animate attributeName="x" values="-3; -20" dur="0.8s" begin="0.55s" fill="freeze"/><animate attributeName="y" values="-3; -50; 20" keyTimes="0; 0.4; 1" calcMode="spline" keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1" dur="0.8s" begin="0.55s" fill="freeze"/><animateTransform attributeName="transform" type="rotate" values="0; 180" dur="0.8s" begin="0.55s" fill="freeze"/></rect>
  </g>

  <g transform="translate(160, 250)">
    <circle cx="0" cy="0" r="6" fill="#78350f" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="0.8s" begin="1.3s" fill="freeze"/><animate attributeName="cx" values="0; -45" dur="0.8s" begin="1.3s" fill="freeze"/><animate attributeName="cy" values="0; -45; 20" keyTimes="0; 0.4; 1" calcMode="spline" keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1" dur="0.8s" begin="1.3s" fill="freeze"/></circle>
    <rect x="-3" y="-3" width="7" height="7" fill="#57534e" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="0.8s" begin="1.35s" fill="freeze"/><animate attributeName="x" values="-3; 25" dur="0.8s" begin="1.35s" fill="freeze"/><animate attributeName="y" values="-3; -55; 20" keyTimes="0; 0.4; 1" calcMode="spline" keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1" dur="0.8s" begin="1.35s" fill="freeze"/><animateTransform attributeName="transform" type="rotate" values="0; -180" dur="0.8s" begin="1.35s" fill="freeze"/></rect>
  </g>

  <g transform="translate(250, 250)">
    <circle cx="-25" cy="0" r="2.5" fill="#78350f" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0; 0.1; 0.9; 1" dur="1.1s" begin="2.6s" fill="freeze"/>
      <animate attributeName="cy" values="0; -8; 0; -4; 0" dur="0.2s" repeatCount="5" begin="2.6s" fill="freeze"/>
    </circle>
    <circle cx="30" cy="0" r="2" fill="#a8a29e" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0; 0.1; 0.9; 1" dur="1.1s" begin="2.6s" fill="freeze"/>
      <animate attributeName="cy" values="0; -6; 0; -3; 0" dur="0.25s" repeatCount="4" begin="2.65s" fill="freeze"/>
    </circle>
    <rect x="-5" y="-2" width="4" height="4" fill="#57534e" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0; 0.1; 0.9; 1" dur="1.1s" begin="2.6s" fill="freeze"/>
      <animate attributeName="y" values="-2; -10; -2; -5; -2" dur="0.18s" repeatCount="6" begin="2.6s" fill="freeze"/>
    </rect>

    <circle cx="0" cy="0" r="8" fill="#78350f" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.7;1" dur="0.7s" begin="3.7s" fill="freeze"/><animate attributeName="cx" values="0; -60" dur="0.7s" begin="3.7s" fill="freeze"/><animate attributeName="cy" values="0; -70; 30" keyTimes="0; 0.3; 1" calcMode="spline" keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1" dur="0.7s" begin="3.7s" fill="freeze"/></circle>
    <circle cx="0" cy="0" r="6" fill="#a8a29e" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.7;1" dur="0.7s" begin="3.7s" fill="freeze"/><animate attributeName="cx" values="0; 55" dur="0.7s" begin="3.7s" fill="freeze"/><animate attributeName="cy" values="0; -60; 25" keyTimes="0; 0.3; 1" calcMode="spline" keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1" dur="0.7s" begin="3.7s" fill="freeze"/></circle>
    <rect x="-5" y="-5" width="10" height="10" fill="#57534e" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.7;1" dur="0.7s" begin="3.75s" fill="freeze"/><animate attributeName="x" values="-5; -40" dur="0.7s" begin="3.75s" fill="freeze"/><animate attributeName="y" values="-5; -80; 30" keyTimes="0; 0.3; 1" calcMode="spline" keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1" dur="0.7s" begin="3.75s" fill="freeze"/><animateTransform attributeName="transform" type="rotate" values="0; 360" dur="0.7s" begin="3.75s" fill="freeze"/></rect>
    <rect x="-4" y="-4" width="8" height="8" fill="#44403c" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.7;1" dur="0.7s" begin="3.7s" fill="freeze"/><animate attributeName="x" values="-4; 30" dur="0.7s" begin="3.7s" fill="freeze"/><animate attributeName="y" values="-4; -75; 30" keyTimes="0; 0.3; 1" calcMode="spline" keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1" dur="0.7s" begin="3.7s" fill="freeze"/><animateTransform attributeName="transform" type="rotate" values="0; -270" dur="0.7s" begin="3.7s" fill="freeze"/></rect>
  </g>

</svg>